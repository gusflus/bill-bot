# Copy to config.yaml and edit. config.yaml is gitignored - it holds your
# household's phone numbers.
#
# This is the only file you configure. There is no setup wizard: Bedrock Claude
# Haiku reads each bill email and works out the amount and due date itself, so
# you never collect sample emails or pick a regex. Just list who pays and which
# senders count as bills.

# Drives the stack name (bill-bot-<suffix>-stack). Lowercase alphanumeric and
# dashes, 1-32 chars.
stack_suffix: home

# Optional. Omit to use CDK_DEFAULT_REGION from your environment / AWS profile.
# Must be a region where both Bedrock and AWS End User Messaging are available.
region: us-west-2

# Used to decide which billing month a bill belongs to, and to format due dates.
timezone: America/Los_Angeles

# Haiku model used to extract the amount, due date, and bill type.
bedrock_model_id: us.anthropic.claude-haiku-4-5-20251001-v1:0

# You - the person who pays the utility and gets reimbursed.
#
# You are NOT a receiver: you already paid the bill, so a text asking you to pay
# yourself would be nonsense. But you do carry a 'share', because your portion
# has to be in the denominator for everyone else's share to come out right. Your
# share is simply absorbed rather than collected.
payee:
  # Your Venmo handle, without the leading '@'. Roommates get a pre-filled
  # venmo.com link for their exact share.
  venmo_username: your-venmo-handle

  # Optional. Zelle publishes no deep-link scheme, so this can only ever appear
  # as text ("Or Zelle $23.76 to you@example.com"). Omit the line entirely to
  # leave Zelle out of your messages.
  zelle_contact: "you@example.com"

  # Your name, used in messages about you.
  label: Gus

  # Your share of each bill, on the same relative scale as the receivers below.
  # Set 0 if you don't take a share and the receivers cover the whole bill.
  share: 1

  # Optional. Needed only for notify_on_payment below.
  phone: "+15551230000"

  # Text you each time someone marks themselves paid, so you know money is
  # coming without having to ask. Requires 'phone'.
  notify_on_payment: true

# Everyone who gets texted a bill, and their share of it. Do not list yourself
# here - you go in 'payee' above.
#
# 'share' is a relative weight, not a percentage - it is normalized against the
# sum of all shares (yours included), so the numbers never have to add up to
# anything in particular. All 1 means an even split. A 2 pays double a 1.
#
# Cents are allocated by largest remainder across everyone, so the per-person
# amounts plus your absorbed share always sum to the bill total exactly.
receivers:
  - { label: Sam,  phone: "+15551230002", share: 1 }
  - { label: Alex, phone: "+15551230003", share: 2 }   # master bedroom
  - { label: Jo,   phone: "+15551230004", share: 1 }

# The bill senders to watch. 'from_address' is matched by Gmail search, so a
# bare domain works and catches every address at that domain.
#
# An 'id' is derived from the name automatically ("PG&E" -> "pg-e") and used in
# the DynamoDB dedup key. Set it explicitly if you ever rename a sender and
# want to keep its history.
senders:
  - { name: "PG&E",     from_address: billpay.pge.com }
  - { name: SoCalGas,   from_address: socalgas.com }
  - { name: WaterSewer, from_address: merchanttransact.com }
  - { name: Spectrum,   from_address: spectrumemails.com }

# What the texts say. Unknown placeholders fail `cdk deploy` rather than
# breaking at 3am when a bill arrives, and deploy prints an estimated SMS
# segment count per template so you can see what each one costs to send.
#
# Available placeholders, by message:
#   bill, reminder:
#     {biller} {total} {amount} {label} {due_date} {month} {venmo_link} {zelle_line}
#   paid_ack:
#     {biller} {label} {amount} {month} {paid_count} {receiver_count}
#   status:
#     {biller} {month} {total} {paid_count} {receiver_count}
#   payment_alert:
#     {biller} {label} {amount} {month} {total} {paid_count} {receiver_count}
#     ({label} and {amount} are whoever just paid, and what they owed)
#   venmo_note:
#     {biller} {label} {amount} {total} {month} {due_date}
#
# Keep them short. SMS bills per 160-character segment and {venmo_link} alone
# is about 90 characters. Any emoji or curly quote drops the budget to 70.
messages:
  bill: |
    {biller} bill received: {total} total.
    Your share, {label}: {amount} - due {due_date}
    Pay: {venmo_link}{zelle_line}
  paid_ack: "Thanks {label}! {paid_count} of {receiver_count} paid the {biller} bill."
  status: "{biller} {month}: {paid_count} of {receiver_count} paid."
  reminder: "Reminder: {amount} still owed for the {biller} bill. {venmo_link}"
  # Only sent to you, and only when payee.notify_on_payment is true.
  payment_alert: "{label} paid {amount} for the {biller} bill. {paid_count} of {receiver_count} in."
  # The comment Venmo pre-fills on the payment. Both you and the sender see it
  # in your Venmo history afterwards, so name the biller. Note that a longer
  # note makes {venmo_link} longer, which can push a message into another
  # billable SMS segment - `cdk deploy` will tell you.
  venmo_note: "{biller} bill split"

behavior:
  # Log the texts instead of sending them. Leave this on until you have watched
  # a few real bills come through the logs - there is no setup wizard to eyeball
  # a pattern beforehand, so this is your supervised break-in period. Also lets
  # you build and test everything before a phone number is provisioned.
  dry_run: true

  # How far back Apps Script searches on each run. Wide enough to survive a
  # failed run, narrow enough not to rescan the whole mailbox.
  lookback_days: 14

  # Applied to a Gmail thread once the Lambda accepts it (2xx). A 4xx applies
  # error_label instead; a 5xx leaves the thread unlabeled so it retries.
  processed_label: Bill-Bot/Processed
  error_label: Bill-Bot/Error

  # What to do when Haiku's amount can't be confirmed against the email text.
  #   send - notify anyway (default); the low confidence is recorded on the bill
  #          record and in the Lambda logs
  #   hold - record the bill but text nobody, and wait for you to look
  # 'send' is the default because a held bill is a silently missed bill.
  on_low_confidence: send

  # Substituted for {due_date} when a bill email doesn't state one.
  no_due_date_text: "date unknown"

  # DynamoDB TTL on bill records. Bill emails contain account numbers, so this
  # keeps them from accumulating forever. Long enough to compare year over year.
  record_ttl_days: 400

messaging:
  # SMS only. MMS costs 3x per message for media this bot never sends, and RCS
  # costs $500 up front plus $200/month in agent maintenance fees.
  channel: sms

  # Your toll-free number's ID, e.g. "phone-abc123def456".
  #
  # Provision and verify it by hand, and leave it out of CloudFormation, so a
  # stack change can never release a number you waited on registration for.
  # Required once dry_run is false.
  origination_number_id: ""

  # Warn at deploy time if a rendered template needs more segments than this.
  # Each segment is billed separately.
  max_segments_warn: 2

# Optional nudges for roommates who haven't paid. Off by default - an automated
# bot texting people about money is worth opting into deliberately.
#
# Only unpaid people are ever contacted, and only once per repeat_days, so
# nobody who has already paid hears about the bill again.
reminders:
  enabled: false
  # Wait this long after the bill went out before the first nudge.
  after_days: 3
  # Then nudge at most once every this many days.
  repeat_days: 3
  # What hour (UTC) the daily check runs.
  hour_utc: 17
