[project]
name = "bill-bot"
version = "0.1.0"
description = "Watches Gmail for utility bill emails, splits each bill among roommates by weight, and texts everyone their share"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.3.0",
    "boto3>=1.35.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "moto[dynamodb]>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# lambdas/shared/python is on the path because those modules import each other
# flatly (`from shares import ...`). The `python/` level is required by Lambda:
# layer content only lands on sys.path when it sits under python/, so the asset
# directory and the test path have to agree on that structure.
pythonpath = [".", "lambdas/shared/python"]

[tool.setuptools]
# Not a distributable package - this repo is deployed, not installed.
py-modules = []
